<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 배경 -->
  <rect width="32" height="32" fill="#F5F5F5" rx="4"/>

  <!-- 서류 본체 -->
  <g id="document">
    <!-- 메인 서류 (뒤) -->
    <rect x="8" y="6" width="16" height="20" fill="#E0E0E0" rx="1"/>

    <!-- 메인 서류 (앞) -->
    <rect x="6" y="4" width="16" height="20" fill="#FFFFFF" stroke="#333333" stroke-width="0.5" rx="1"/>

    <!-- 접힌 모서리 -->
    <path d="M 18 4 L 22 8 L 18 8 Z" fill="#F0F0F0" stroke="#333333" stroke-width="0.5"/>

    <!-- 텍스트 라인들 -->
    <rect x="9" y="11" width="8" height="1" fill="#666666" rx="0.5"/>
    <rect x="9" y="14" width="10" height="1" fill="#666666" rx="0.5"/>
    <rect x="9" y="17" width="7" height="1" fill="#666666" rx="0.5"/>
    <rect x="9" y="20" width="9" height="1" fill="#666666" rx="0.5"/>

    <!-- 헤더 영역 -->
    <rect x="9" y="7" width="10" height="2" fill="#4285F4" rx="0.5"/>
  </g>

  <!-- 체크 마크 -->
  <g id="check">
    <circle cx="23" cy="23" r="5" fill="#34A853"/>
    <path d="M 20 23 L 22 25 L 26 21" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>