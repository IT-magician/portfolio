<svg viewBox="0 0 2000 1300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6ecf2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-request" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto" fill="#2980b9">
      <path d="M0,0 L10,3.5 L0,7 z" />
    </marker>
    <marker id="arrow-response" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto" fill="#c0392b">
      <path d="M0,0 L10,3.5 L0,7 z" />
    </marker>
  </defs>

  <rect width="2000" height="1300" fill="url(#bgGradient)"/>

  <g id="title">
    <rect x="50" y="20" width="1900" height="80" rx="10" fill="#2c3e50" filter="url(#shadow)"/>
    <text x="1000" y="55" text-anchor="middle" font-size="32" font-weight="bold" fill="#ecf0f1">v2x-httpsd Architecture</text>
    <text x="1000" y="80" text-anchor="middle" font-size="18" fill="#bdc3c7">Vehicle-to-Everything HTTP Secure Daemon for PKI Client</text>
  </g>

  <g id="external-components">
    <rect x="50" y="550" width="250" height="120" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2" filter="url(#shadow)"/>
    <text x="175" y="590" text-anchor="middle" font-size="20" font-weight="bold" fill="#ecf0f1">v2x manager</text>
    <text x="175" y="615" text-anchor="middle" font-size="16" fill="#ecf0f1">PKI Client</text>
    <text x="175" y="635" text-anchor="middle" font-size="12" fill="#ecf0f1">(A사/B사/C사)</text>

    <rect x="1700" y="550" width="250" height="120" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2" filter="url(#shadow)"/>
    <text x="1825" y="590" text-anchor="middle" font-size="20" font-weight="bold" fill="#ecf0f1">SCMS Server</text>
    <text x="1825" y="615" text-anchor="middle" font-size="16" fill="#ecf0f1">Certificate Authority</text>
    <text x="1825" y="635" text-anchor="middle" font-size="14" fill="#ecf0f1">HTTPS/TLS</text>
  </g>

  <g id="main-container">
    <rect x="350" y="130" width="1300" height="950" rx="15" fill="#ffefd6" stroke="#f39c12" stroke-width="3" filter="url(#shadow)"/>
    <text x="380" y="165" font-size="24" font-weight="bold" fill="#d68910">v2x-httpsd Process</text>
    <text x="1480" y="165" font-size="14" fill="#d68910" font-style="italic">OCP-based Plugin Architecture</text>

    <g id="ipc-layer">
      <rect x="380" y="190" width="380" height="680" rx="10" fill="#d5e8f7" stroke="#3498db" stroke-width="2"/>
      <text x="570" y="225" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c5aa0">IPC Layer</text>
      <text x="570" y="245" text-anchor="middle" font-size="12" fill="#34495e" font-style="italic">프로젝트별 선택 가능 / 확장 가능한 설계</text>

      <g id="pcl-implementation">
        <rect x="400" y="270" width="340" height="190" rx="8" fill="#aed6f1" stroke="#2980b9" stroke-width="2"/>
        <text x="570" y="295" text-anchor="middle" font-size="18" font-weight="bold">PCL IPC</text>
        <text x="570" y="315" text-anchor="middle" font-size="14">Shared Memory</text>
        <text x="410" y="335" text-anchor="start" font-size="12" fill="#34495e">• Topic-based messaging</text>
        <text x="410" y="350" text-anchor="start" font-size="12" fill="#34495e">• Request Topic ID: 7</text>
        <text x="410" y="365" text-anchor="start" font-size="12" fill="#34495e">• Response Topic ID: 8</text>
        
        <rect x="410" y="385" width="320" height="65" rx="5" fill="#85c1e9" stroke="#2c5aa0"/>
        <text x="420" y="400" text-anchor="start" font-size="12" font-weight="bold" fill="#1A237E">Pcl_ReceivedQueueMonitor</text>
        <text x="420" y="415" text-anchor="start" font-size="11" fill="#1a5490">• PCL read() 특성 해결 (topic 참조변수 덮어씀)</text>
        <text x="420" y="428" text-anchor="start" font-size="11" fill="#1a5490">• 생산자-소비자 패턴 / Topic별 개별 Queue</text>
      </g>

      <rect x="400" y="470" width="340" height="160" rx="8" fill="#85c1e9" stroke="#2980b9" stroke-width="2"/>
      <text x="570" y="495" text-anchor="middle" font-size="18" font-weight="bold">POSIX Queue IPC</text>
      <text x="570" y="515" text-anchor="middle" font-size="14">Message Queue</text>
      <text x="410" y="535" text-anchor="start" font-size="12" fill="#34495e">• /v2x-httpsd-req.queue</text>
      <text x="410" y="550" text-anchor="start" font-size="12" fill="#34495e">• /v2x-httpsd-res.queue</text>
      <text x="410" y="565" text-anchor="start" font-size="12" fill="#34495e">• Fragment support (8KB)</text>
      <text x="410" y="580" text-anchor="start" font-size="12" fill="#34495e">• Reassembly logic</text>
      <text x="410" y="595" text-anchor="start" font-size="12" fill="#34495e">• BMW 등 PCL 제약 대응</text>

      <rect x="400" y="640" width="340" height="115" rx="8" fill="#5dade2" stroke="#2980b9" stroke-width="2"/>
      <text x="570" y="665" text-anchor="middle" font-size="18" font-weight="bold">Socket IPC</text>
      <text x="570" y="685" text-anchor="middle" font-size="14">Unix Domain Socket</text>
      <text x="410" y="705" text-anchor="start" font-size="12" fill="#34495e">• /tmp/v2x-httpsd.sock</text>
      <text x="410" y="720" text-anchor="start" font-size="12" fill="#34495e">• Server/Client, Auto-reconnect, Stream-based</text>
      <text x="410" y="735" text-anchor="start" font-size="12" fill="#34495e">• 범용 백업 옵션</text>
    </g>

    <g id="data-processing">
      <rect x="810" y="190" width="380" height="680" rx="10" fill="#d5f4e6" stroke="#27ae60" stroke-width="2"/>
      <text x="1000" y="225" text-anchor="middle" font-size="20" font-weight="bold" fill="#196f3d">Data Processing Core</text>

      <rect x="830" y="270" width="340" height="110" rx="8" fill="#82e0aa" stroke="#229954" stroke-width="2"/>
      <text x="1000" y="295" text-anchor="middle" font-size="18" font-weight="bold">Binary Stream Converter</text>
      <text x="1000" y="315" text-anchor="middle" font-size="14">ObjectMapper</text>
      <text x="840" y="335" text-anchor="start" font-size="12" fill="#0e5e2e">• C구조체 ↔ Binary 변환 (serialize/deserialize)</text>
      <text x="840" y="350" text-anchor="start" font-size="12" fill="#0e5e2e">• IPC Layer에 동일한 데이터 타입의 공통 직렬화 로직 제공 (OCP)</text>

      <rect x="830" y="390" width="340" height="110" rx="8" fill="#58d68d" stroke="#229954" stroke-width="2"/>
      <text x="1000" y="415" text-anchor="middle" font-size="18" font-weight="bold">HTTP Request Adapter</text>
      <text x="1000" y="435" text-anchor="middle" font-size="14">Binary → HTTP Components</text>
      <text x="840" y="455" text-anchor="start" font-size="12" fill="#0e5e2e">• Binary → URL, Method, Headers, Body</text>
      <text x="840" y="470" text-anchor="start" font-size="12" fill="#0e5e2e">• URL 검증 책임을 CurlWrapper과 분리</text>

      <rect x="830" y="510" width="340" height="95" rx="8" fill="#2ecc71" stroke="#229954" stroke-width="2"/>
      <text x="1000" y="535" text-anchor="middle" font-size="18" font-weight="bold">HTTP Response Adapter</text>
      <text x="1000" y="555" text-anchor="middle" font-size="14">HTTP Components → Binary Format</text>
      <text x="840" y="575" text-anchor="start" font-size="12" fill="#0e5e2e">• Response Code, Headers, Body → Binary</text>

      <rect x="830" y="615" width="340" height="180" rx="8" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <text x="1000" y="640" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">HTTP Response Handler</text>
      <text x="1000" y="660" text-anchor="middle" font-size="14" fill="#fff">Post-processing Pipeline</text>
      <text x="840" y="680" text-anchor="start" font-size="12" fill="#d5f4e6">• header_filtering_Job(...)</text>
      <text x="840" y="695" text-anchor="start" font-size="12" fill="#d5f4e6">• save_HttpBodyToFile_Job(...)</text>
      <text x="850" y="710" text-anchor="start" font-size="11" fill="#d5f4e6">- JSON 'package' field's value → base64 decode</text>
      <text x="850" y="725" text-anchor="start" font-size="12" fill="#d5f4e6">- enrollment-package.zip 저장</text>
      <text x="840" y="740" text-anchor="start" font-size="11" fill="#d5f4e6">• doNextJobWhen(...)</text>
      <text x="850" y="755" text-anchor="start" font-size="11" fill="#d5f4e6">- [Add-on] 조건부 Job 실행 제어 활성화</text>
    </g>

    <g id="http-engine">
      <rect x="1240" y="190" width="380" height="680" rx="10" fill="#fadbd8" stroke="#e74c3c" stroke-width="2"/>
      <text x="1430" y="225" text-anchor="middle" font-size="20" font-weight="bold" fill="#922b21">HTTP/TLS Engine</text>

      <rect x="1260" y="260" width="340" height="135" rx="8" fill="#f1948a" stroke="#cb4335" stroke-width="2"/>
      <text x="1430" y="285" text-anchor="middle" font-size="18" font-weight="bold">CURL Wrapper</text>
      <text x="1430" y="305" text-anchor="middle" font-size="14">libcurl Integration</text>
      <text x="1270" y="325" text-anchor="start" font-size="12" fill="#641e16">• HTTP/HTTPS client</text>
      <text x="1270" y="340" text-anchor="start" font-size="12" fill="#641e16">• SSL/TLS context mgmt</text>
      <text x="1270" y="355" text-anchor="start" font-size="12" fill="#641e16">• Certificate validation</text>
      <text x="1270" y="370" text-anchor="start" font-size="12" fill="#641e16">• 에러 시 NTP 시간 검증</text>

      <rect x="1260" y="405" width="340" height="90" rx="8" fill="#ec7063" stroke="#cb4335" stroke-width="2"/>
      <text x="1430" y="430" text-anchor="middle" font-size="18" font-weight="bold">SSL Context</text>
      <text x="1430" y="450" text-anchor="middle" font-size="14">동적 인증서 관리</text>
      <text x="1270" y="470" text-anchor="start" font-size="12" fill="#641e16">• 사설 SSL/TLS 인증서 로드를 위한 확장</text>

      <rect x="1260" y="505" width="340" height="70" rx="8" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
      <text x="1430" y="530" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">NTP Client</text>
      <text x="1430" y="550" text-anchor="middle" font-size="12" fill="#fff">시스템 시간 검증(비교) 및 인증서 유효성 보장</text>

      <g id="configuration">
        <rect x="1260" y="585" width="340" height="200" rx="8" fill="#e8daef" stroke="#8e44ad" stroke-width="2"/>
        <text x="1430" y="610" text-anchor="middle" font-size="18" font-weight="bold" fill="#6c3483">Configuration</text>
        <text x="1430" y="630" text-anchor="middle" font-size="14">PKI Client Config</text>
        <text x="1270" y="650" text-anchor="start" font-size="12" fill="#512e5f">• JSON config file</text>
        <text x="1270" y="665" text-anchor="start" font-size="12" fill="#512e5f">• File watcher (hot reload)</text>
        <text x="1270" y="680" text-anchor="start" font-size="12" fill="#512e5f">• Server endpoints</text>
        <text x="1270" y="695" text-anchor="start" font-size="12" fill="#512e5f">• Certificate paths</text>
        
        <rect x="1270" y="720" width="320" height="55" rx="5" fill="#ce93d8" stroke="#8e44ad"/>
        <text x="1430" y="740" text-anchor="middle" font-size="13" font-weight="bold">Graceful Shutdown</text>
        <text x="1430" y="758" text-anchor="middle" font-size="11">signal handler + atexit 연계</text>
      </g>
    </g>

    <g id="main-loop">
      <rect x="380" y="890" width="1240" height="90" rx="10" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
      <text x="1000" y="920" text-anchor="middle" font-size="22" font-weight="bold" fill="#935116">Main Daemon Loop</text>
      <text x="1000" y="945" text-anchor="middle" font-size="16" fill="#6e2c00">run_daemon()</text>
      <text x="1000" y="965" text-anchor="middle" font-size="14" fill="#6e2c00">IPC Read → Adapt → HTTP Request → SCMS → HTTP Response → Adapt → IPC Write</text>
    </g>
  </g>

  <g id="data-flow-arrows">
    <path d="M 300 610 L 380 610" stroke="#2980b9" stroke-width="3" marker-end="url(#arrow-request)" fill="none"/>
    <text x="340" y="602" text-anchor="middle" font-size="14" fill="#2980b9" font-weight="bold">IPC Request</text>

    <path d="M 760 610 L 810 610" stroke="#2980b9" stroke-width="3" marker-end="url(#arrow-request)" fill="none"/>

    <path d="M 1190 610 L 1240 610" stroke="#2980b9" stroke-width="3" marker-end="url(#arrow-request)" fill="none"/>

    <path d="M 1620 610 L 1700 610" stroke="#2980b9" stroke-width="3" marker-end="url(#arrow-request)" fill="none"/>
    <text x="1660" y="602" text-anchor="middle" font-size="14" fill="#2980b9" font-weight="bold">HTTPS Request</text>

    <path d="M 1700 650 L 1620 650" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow-response)" fill="none" stroke-dasharray="5,3"/>
    <text x="1660" y="668" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">HTTPS Response</text>

    <path d="M 1240 650 L 1190 650" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow-response)" fill="none" stroke-dasharray="5,3"/>

    <path d="M 810 650 L 760 650" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow-response)" fill="none" stroke-dasharray="5,3"/>

    <path d="M 380 650 L 300 650" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow-response)" fill="none" stroke-dasharray="5,3"/>
    <text x="340" y="668" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">IPC Response</text>
  </g>

  <g id="legend">
    <rect x="50" y="1100" width="1900" height="120" rx="10" fill="#34495e" filter="url(#shadow)"/>
    <text x="70" y="1125" font-size="16" font-weight="bold" fill="#ecf0f1">Key Features:</text>
    <text x="70" y="1145" font-size="14" fill="#bdc3c7">• Multiple IPC mechanisms (PCL shared memory, POSIX message queue, Unix socket)</text>
    <text x="70" y="1165" font-size="14" fill="#bdc3c7">• Automatic message fragmentation/reassembly • Dynamic SSL/TLS certificate management • Hot-reload configuration</text>
    <text x="70" y="1185" font-size="14" fill="#bdc3c7">• OCP-based plugin architecture for extensibility • SRP for clear debugging boundaries • Graceful shutdown with resource cleanup</text>
    <text x="70" y="1205" font-size="14" fill="#bdc3c7">• NTP time validation for certificate validity • Comprehensive logging with DLT</text>
  </g>
</svg>