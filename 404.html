<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... | Portfolio</title>
    <style>
        :root {
            --primary-color: #d4a574;
            --primary-dark: #b8935f;
            --primary-light: #e6d5c3;
            --primary-lighter: #f9f4ee;
            --text-primary: #3a3a3a;
            --text-secondary: #6b6b6b;
            --border-color: #e5e5e5;
            --background: #fafafa;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary-lighter) 0%, var(--white) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            animation: fadeIn 0.6s ease-out;
        }

        /* Loading State */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .spinner-container {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 3px solid var(--primary-lighter);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .spinner-inner {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 2px solid transparent;
            border-top-color: var(--primary-dark);
            border-radius: 50%;
            animation: spin 1.5s linear infinite reverse;
        }

        .loading-dots {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        .loading-text {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-top: 1rem;
        }

        .path-info {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: var(--primary-dark);
            background: var(--primary-lighter);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            margin-top: 1rem;
            word-break: break-all;
        }

        /* 404 Error State */
        .error-state {
            display: none;
            animation: slideUp 0.5s ease-out;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 2px 2px 0 var(--primary-lighter);
            animation: glitch 2s infinite;
            position: relative;
        }

        .error-code::before,
        .error-code::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            overflow: hidden;
        }

        .error-code::before {
            animation: glitch-1 0.5s infinite;
            color: var(--primary-dark);
            z-index: -1;
        }

        .error-code::after {
            animation: glitch-2 0.5s infinite;
            color: var(--primary-light);
            z-index: -2;
        }

        .error-title {
            font-size: 2rem;
            margin: 1rem 0;
            color: var(--text-primary);
        }

        .error-message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .error-path {
            font-family: 'Courier New', monospace;
            background: var(--primary-lighter);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            color: var(--primary-dark);
            display: inline-block;
            margin: 0.5rem 0;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 165, 116, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-secondary:hover {
            background: var(--primary-lighter);
            transform: translateY(-2px);
        }

        /* Fun decorative elements */
        .decoration {
            position: fixed;
            opacity: 0.1;
            pointer-events: none;
        }

        .decoration-1 {
            top: 10%;
            left: 5%;
            width: 100px;
            height: 100px;
            border: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .decoration-2 {
            top: 20%;
            right: 10%;
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            transform: rotate(45deg);
            animation: float 8s ease-in-out infinite reverse;
        }

        .decoration-3 {
            bottom: 15%;
            left: 10%;
            width: 80px;
            height: 80px;
            border: 2px solid var(--primary-dark);
            transform: rotate(45deg);
            animation: spin 20s linear infinite;
        }

        .decoration-4 {
            bottom: 20%;
            right: 5%;
            width: 120px;
            height: 120px;
            border: 4px solid var(--primary-light);
            border-radius: 50%;
            animation: float 10s ease-in-out infinite;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            91% { transform: translate(-2px, 2px); }
            92% { transform: translate(2px, -2px); }
            93% { transform: translate(-2px, 0); }
        }

        @keyframes glitch-1 {
            0%, 90%, 100% { clip-path: inset(0 0 0 0); }
            20% { clip-path: inset(20% 0 30% 0); }
            40% { clip-path: inset(50% 0 20% 0); }
        }

        @keyframes glitch-2 {
            0%, 90%, 100% { clip-path: inset(0 0 0 0); }
            30% { clip-path: inset(10% 0 60% 0); }
            60% { clip-path: inset(40% 0 30% 0); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .error-code {
                font-size: 5rem;
            }
            
            .error-title {
                font-size: 1.5rem;
            }
            
            .action-buttons {
                flex-direction: column;
                width: 100%;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Decorative elements -->
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    <div class="decoration decoration-3"></div>
    <div class="decoration decoration-4"></div>

    <div class="container">
        <!-- Loading State -->
        <div id="loadingState" class="loading-state">
            <div class="spinner-container">
                <div class="spinner"></div>
                <div class="spinner-inner"></div>
            </div>
            <div>
                <div class="loading-text">Detecting project type...</div>
                <div class="loading-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="path-info" id="pathInfo"></div>
            </div>
        </div>

        <!-- 404 Error State -->
        <div id="errorState" class="error-state">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                Oops! The page you're looking for doesn't exist.<br>
                <span class="error-path" id="errorPath"></span>
            </p>
            <div class="action-buttons">
                <a href="/" class="btn btn-primary">
                    ← Back to Portfolio
                </a>
                <button onclick="window.history.back()" class="btn btn-secondary">
                    Go Back
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const path = window.location.pathname;
            const origin = window.location.origin;
            
            // UI 요소
            const loadingState = document.getElementById('loadingState');
            const errorState = document.getElementById('errorState');
            const pathInfo = document.getElementById('pathInfo');
            const errorPath = document.getElementById('errorPath');
            
            // 현재 경로 표시
            pathInfo.textContent = `Checking: ${path}`;
            errorPath.textContent = path;
            
            // 재귀 방지
            const attemptedKey = 'attempted_404_paths';
            const attempted = JSON.parse(sessionStorage.getItem(attemptedKey) || '[]');
            
            if (attempted.includes(path)) {
                // 이미 시도했던 경로면 진짜 404
                sessionStorage.removeItem(attemptedKey);
                showError();
                return;
            }
            
            // 경로 분석
            const pathParts = path.split('/').filter(Boolean);
            if (pathParts.length === 0) {
                window.location.replace('/');
                return;
            }
            
            const firstDir = pathParts[0];
            
            // 알려진 정적 파일 제외
            const staticFiles = ['hello.html', 'about.html', 'assets', 'images', 'favicon'];
            if (staticFiles.some(file => firstDir.includes(file))) {
                setTimeout(showError, 500);
                return;
            }
            
            // 알려진 SPA 프로젝트 설정 (라우팅 방식 포함)
            const knownSPAs = {
                'v2x-security-career': { type: 'hash' },  // HashRouter 사용
                'react-portfolio': { type: 'browser' },    // BrowserRouter 사용
                'vue-dashboard': { type: 'hash' }          // Vue Hash 모드
                // 새 프로젝트 추가 시: 'project-name': { type: 'hash' | 'browser' }
            };
            
            if (knownSPAs[firstDir]) {
                redirectToSPA(firstDir, path, knownSPAs[firstDir].type);
                return;
            }
            
            // 동적 감지 (알려지지 않은 프로젝트)
            checkIfProjectExists(firstDir, path);
            
            async function checkIfProjectExists(projectName, fullPath) {
                try {
                    const checkUrl = `${origin}/${projectName}/index.html`;
                    const response = await fetch(checkUrl, { 
                        method: 'HEAD',
                        cache: 'no-cache' 
                    });
                    
                    if (response.ok) {
                        // SPA 발견 - 기본적으로 hash 라우팅 사용
                        console.log(`Found SPA: ${projectName}`);
                        redirectToSPA(projectName, fullPath, 'hash');
                    } else {
                        setTimeout(showError, 500);
                    }
                } catch (error) {
                    setTimeout(showError, 500);
                }
            }
            
            function redirectToSPA(projectName, fullPath, routingType = 'hash') {
                // 프로젝트 경로 이후의 하위 경로 추출
                const projectBasePath = `/${projectName}`;
                const subPath = fullPath.substring(projectBasePath.length) || '/';
                
                // 재귀 방지 기록
                attempted.push(fullPath);
                sessionStorage.setItem(attemptedKey, JSON.stringify(attempted));
                
                let redirectUrl;
                
                if (routingType === 'hash') {
                    // HashRouter를 사용하는 프로젝트
                    // 하위 경로를 해시로 변환
                    redirectUrl = `${projectBasePath}/#${subPath}`;
                    pathInfo.textContent = `Found ${projectName} project! Redirecting to hash route...`;
                } else if (routingType === 'browser') {
                    // BrowserRouter를 사용하는 프로젝트
                    // sessionStorage에 원래 경로 저장 (프로젝트에서 처리)
                    sessionStorage.setItem('spa_redirect_path', subPath);
                    sessionStorage.setItem('spa_redirect_from_404', 'true');
                    
                    // URL 파라미터로도 전달 (대체 방법)
                    const encodedPath = encodeURIComponent(subPath);
                    redirectUrl = `${projectBasePath}/?redirect=${encodedPath}`;
                    pathInfo.textContent = `Found ${projectName} project! Redirecting with path info...`;
                }
                
                console.log(`Redirecting from ${fullPath} to ${redirectUrl}`);
                
                setTimeout(() => {
                    window.location.replace(redirectUrl);
                }, 500);
            }
            
            function showError() {
                sessionStorage.removeItem(attemptedKey);
                sessionStorage.removeItem('spa_redirect_path');
                sessionStorage.removeItem('spa_redirect_from_404');
                loadingState.style.display = 'none';
                errorState.style.display = 'block';
            }
            
            // 10초 후에도 로딩 중이면 에러 표시
            setTimeout(() => {
                if (loadingState.style.display !== 'none') {
                    showError();
                }
            }, 10000);
        })();
    </script>
    
    <!-- 
    ============================================
    각 SPA 프로젝트의 index.html에 추가해야 할 코드
    ============================================
    
    BrowserRouter를 사용하는 React 프로젝트의 경우:
    
    <script>
        // 404.html에서 리다이렉트된 경우 처리
        (function() {
            // sessionStorage에서 경로 확인
            const redirectPath = sessionStorage.getItem('spa_redirect_path');
            const isFrom404 = sessionStorage.getItem('spa_redirect_from_404');
            
            if (isFrom404 === 'true' && redirectPath) {
                // 정리
                sessionStorage.removeItem('spa_redirect_path');
                sessionStorage.removeItem('spa_redirect_from_404');
                
                // React Router로 네비게이션
                window.history.replaceState(null, '', redirectPath);
            }
            
            // URL 파라미터 확인 (대체 방법)
            const urlParams = new URLSearchParams(window.location.search);
            const redirectParam = urlParams.get('redirect');
            
            if (redirectParam) {
                const decodedPath = decodeURIComponent(redirectParam);
                window.history.replaceState(null, '', decodedPath);
            }
        })();
    </script>
    
    HashRouter를 사용하는 프로젝트는 별도 처리 불필요 (자동으로 해시 라우팅됨)
    -->
</body>
</html>
