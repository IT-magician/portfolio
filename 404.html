<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Loading... | Portfolio</title>
    <style>
        :root {
            --primary-color: #d4a574;
            --primary-dark: #b8935f;
            --primary-light: #e6d5c3;
            --primary-lighter: #f9f4ee;
            --text-primary: #3a3a3a;
            --text-secondary: #6b6b6b;
            --border-color: #e5e5e5;
            --background: #fafafa;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary-lighter) 0%, var(--white) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            animation: fadeIn 0.6s ease-out;
        }

        /* Loading State */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .spinner-container {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 3px solid var(--primary-lighter);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .spinner-inner {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 2px solid transparent;
            border-top-color: var(--primary-dark);
            border-radius: 50%;
            animation: spin 1.5s linear infinite reverse;
        }

        .loading-dots {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        .loading-text {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-top: 1rem;
        }

        .path-info {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: var(--primary-dark);
            background: var(--primary-lighter);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            margin-top: 1rem;
            word-break: break-all;
        }

        /* 404 Error State */
        .error-state {
            display: none;
            animation: slideUp 0.5s ease-out;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 2px 2px 0 var(--primary-lighter);
            animation: glitch 2s infinite;
            position: relative;
        }

        .error-code::before,
        .error-code::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            overflow: hidden;
        }

        .error-code::before {
            animation: glitch-1 0.5s infinite;
            color: var(--primary-dark);
            z-index: -1;
        }

        .error-code::after {
            animation: glitch-2 0.5s infinite;
            color: var(--primary-light);
            z-index: -2;
        }

        .error-title {
            font-size: 2rem;
            margin: 1rem 0;
            color: var(--text-primary);
        }

        .error-message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .error-path {
            font-family: 'Courier New', monospace;
            background: var(--primary-lighter);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            color: var(--primary-dark);
            display: inline-block;
            margin: 0.5rem 0;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 165, 116, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-secondary:hover {
            background: var(--primary-lighter);
            transform: translateY(-2px);
        }

        /* Fun decorative elements */
        .decoration {
            position: fixed;
            opacity: 0.1;
            pointer-events: none;
        }

        .decoration-1 {
            top: 10%;
            left: 5%;
            width: 100px;
            height: 100px;
            border: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .decoration-2 {
            top: 20%;
            right: 10%;
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            transform: rotate(45deg);
            animation: float 8s ease-in-out infinite reverse;
        }

        .decoration-3 {
            bottom: 15%;
            left: 10%;
            width: 80px;
            height: 80px;
            border: 2px solid var(--primary-dark);
            transform: rotate(45deg);
            animation: spin 20s linear infinite;
        }

        .decoration-4 {
            bottom: 20%;
            right: 5%;
            width: 120px;
            height: 120px;
            border: 4px solid var(--primary-light);
            border-radius: 50%;
            animation: float 10s ease-in-out infinite;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            91% { transform: translate(-2px, 2px); }
            92% { transform: translate(2px, -2px); }
            93% { transform: translate(-2px, 0); }
        }

        @keyframes glitch-1 {
            0%, 90%, 100% { clip-path: inset(0 0 0 0); }
            20% { clip-path: inset(20% 0 30% 0); }
            40% { clip-path: inset(50% 0 20% 0); }
        }

        @keyframes glitch-2 {
            0%, 90%, 100% { clip-path: inset(0 0 0 0); }
            30% { clip-path: inset(10% 0 60% 0); }
            60% { clip-path: inset(40% 0 30% 0); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .error-code {
                font-size: 5rem;
            }
            
            .error-title {
                font-size: 1.5rem;
            }
            
            .action-buttons {
                flex-direction: column;
                width: 100%;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Decorative elements -->
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    <div class="decoration decoration-3"></div>
    <div class="decoration decoration-4"></div>

    <div class="container">
        <!-- Loading State -->
        <div id="loadingState" class="loading-state">
            <div class="spinner-container">
                <div class="spinner"></div>
                <div class="spinner-inner"></div>
            </div>
            <div>
                <div class="loading-text">Detecting project type...</div>
                <div class="loading-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="path-info" id="pathInfo"></div>
            </div>
        </div>

        <!-- 404 Error State -->
        <div id="errorState" class="error-state">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                Oops! The page you're looking for doesn't exist.<br>
                <span class="error-path" id="errorPath"></span>
            </p>
            <div class="action-buttons">
                <a href="/" class="btn btn-primary">
                    ← Back to Portfolio
                </a>
                <button onclick="window.history.back()" class="btn btn-secondary">
                    Go Back
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // BFCache 무효화 - 페이지가 캐시되지 않도록 강제
            window.addEventListener('pageshow', function(event) {
                if (event.persisted) {
                    // BFCache에서 복원된 경우
                    console.log('Page restored from BFCache, forcing reload');
                    window.location.reload();
                }
            });
            
            // unload 이벤트 추가로 BFCache 방지 (일부 브라우저)
            window.addEventListener('unload', function() {});
            
            // 이미 처리한 경로인지 확인
            const currentPath = window.location.pathname;
            const lastProcessedPath = sessionStorage.getItem('last_404_processed');
            const lastProcessedTime = parseInt(sessionStorage.getItem('last_404_time') || '0');
            const now = Date.now();
            
            // 2초 이내에 같은 경로를 다시 처리하려고 하면
            if (lastProcessedPath === currentPath && (now - lastProcessedTime) < 2000) {
                // 프로젝트 루트로 즉시 이동
                const pathParts = currentPath.split('/').filter(Boolean);
                if (pathParts.length > 0) {
                    const projectBase = `/${pathParts[0]}`;
                    console.log('Duplicate 404 processing detected, redirecting to:', projectBase);
                    window.location.replace(projectBase);
                    return;
                }
            }
            
            // 현재 처리 기록
            sessionStorage.setItem('last_404_processed', currentPath);
            sessionStorage.setItem('last_404_time', now.toString());
            
            // 보안 및 경로 유틸리티 함수들
            const SecurityUtils = {
                // 경로 정규화 및 보안 검증
                sanitizePath: function(path) {
                    // 기본 정리
                    let sanitized = path
                        .replace(/\/+/g, '/')  // 중복 슬래시 제거
                        .replace(/\\/g, '/')   // 백슬래시를 슬래시로
                        .trim();
                    
                    // 경로 탐색 공격 방어
                    if (sanitized.includes('../') || sanitized.includes('..\\')) {
                        console.warn('Path traversal attempt detected:', path);
                        return '/';
                    }
                    
                    // URL 디코딩 (안전하게)
                    try {
                        sanitized = decodeURIComponent(sanitized);
                    } catch (e) {
                        // 잘못된 인코딩은 그대로 사용
                        console.warn('Invalid URL encoding:', sanitized);
                    }
                    
                    // 특수 문자 검증
                    const validPathRegex = /^[a-zA-Z0-9\-_\/\.\@\~\!\$\&\'\(\)\*\+\,\;\=\:\s]+$/;
                    if (!validPathRegex.test(sanitized) && !/[\u0080-\uFFFF]/.test(sanitized)) {
                        console.warn('Invalid characters in path:', sanitized);
                        return '/';
                    }
                    
                    return sanitized;
                },
                
                // XSS 방어를 위한 HTML 이스케이프
                escapeHtml: function(text) {
                    const map = {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#039;'
                    };
                    return text.replace(/[&<>"']/g, m => map[m]);
                },
                
                // 프로젝트명 검증
                isValidProjectName: function(name) {
                    // 프로젝트명 규칙: 영문, 숫자, 하이픈, 언더스코어만
                    return /^[a-zA-Z0-9\-_]+$/.test(name) && name.length < 100;
                }
            };
            
            // 상태 관리
            const StateManager = {
                maxAttempts: 3,
                attemptCount: 0,
                
                // 무한 루프 방지
                checkInfiniteLoop: function() {
                    const loopKey = 'redirect_loop_count';
                    const loopTime = 'redirect_loop_time';
                    const now = Date.now();
                    const lastTime = parseInt(sessionStorage.getItem(loopTime) || '0');
                    let count = parseInt(sessionStorage.getItem(loopKey) || '0');
                    
                    // 5초 내에 3번 이상 리다이렉트 시도
                    if (now - lastTime < 5000) {
                        count++;
                        if (count > 3) {
                            sessionStorage.removeItem(loopKey);
                            sessionStorage.removeItem(loopTime);
                            return true; // 무한 루프 감지
                        }
                    } else {
                        count = 1;
                    }
                    
                    sessionStorage.setItem(loopKey, count.toString());
                    sessionStorage.setItem(loopTime, now.toString());
                    return false;
                },
                
                // 동시 실행 방지
                lockRedirect: function() {
                    const lockKey = 'redirect_lock';
                    const lock = sessionStorage.getItem(lockKey);
                    const now = Date.now();
                    
                    if (lock && (now - parseInt(lock)) < 1000) {
                        return false; // 이미 실행 중
                    }
                    
                    sessionStorage.setItem(lockKey, now.toString());
                    return true;
                },
                
                unlockRedirect: function() {
                    sessionStorage.removeItem('redirect_lock');
                }
            };
            
            // 메인 로직
            const rawPath = window.location.pathname;
            const origin = window.location.origin;
            
            // UI 요소
            const loadingState = document.getElementById('loadingState');
            const errorState = document.getElementById('errorState');
            const pathInfo = document.getElementById('pathInfo');
            const errorPath = document.getElementById('errorPath');
            
            // 보안: 경로 정리 및 표시
            const path = SecurityUtils.sanitizePath(rawPath);
            pathInfo.textContent = `Checking: ${SecurityUtils.escapeHtml(path)}`;
            errorPath.textContent = SecurityUtils.escapeHtml(path);

            if (path === '/v2x-security') {
                window.location.replace('/v2x-security-career/pki-journey/cryptic-language'); 
                return;
            }
            
            // 무한 루프 체크
            if (StateManager.checkInfiniteLoop()) {
                console.error('Redirect loop detected!');
                showError();
                return;
            }
            
            // 동시 실행 방지
            if (!StateManager.lockRedirect()) {
                console.warn('Redirect already in progress');
                return;
            }
            
            // 재귀 방지
            const attemptedKey = 'attempted_404_paths';
            const attempted = JSON.parse(sessionStorage.getItem(attemptedKey) || '[]');
            
            if (attempted.includes(path)) {
                // 이미 시도했던 경로면 진짜 404
                sessionStorage.removeItem(attemptedKey);
                StateManager.unlockRedirect();
                showError();
                return;
            }
            
            // 경로 분석
            const pathParts = path.split('/').filter(Boolean);
            if (pathParts.length === 0) {
                StateManager.unlockRedirect();
                window.location.replace('/');
                return;
            }
            
            const firstDir = pathParts[0];
            
            // 프로젝트명 검증
            if (!SecurityUtils.isValidProjectName(firstDir)) {
                console.warn('Invalid project name:', firstDir);
                StateManager.unlockRedirect();
                showError();
                return;
            }
            
            // 알려진 정적 파일 및 시스템 경로 제외
            const staticPaths = [
                'assets', 'images', 'css', 'js', 'fonts', 
                'favicon', '_next', '.well-known', 'api',
                'node_modules', '.git', 'dist', 'build'
            ];
            
            // 정적 파일 확장자 체크 (더 엄격하게)
            const staticExtensions = [
                '.html', '.css', '.js', '.json', '.xml', '.txt',
                '.jpg', '.jpeg', '.png', '.gif', '.svg', '.ico',
                '.pdf', '.zip', '.woff', '.woff2', '.ttf', '.eot'
            ];
            
            const hasFileExtension = staticExtensions.some(ext => 
                firstDir.toLowerCase().endsWith(ext)
            );
            
            if (staticPaths.includes(firstDir.toLowerCase()) || hasFileExtension) {
                StateManager.unlockRedirect();
                setTimeout(showError, 500);
                return;
            }
            
            // 모든 디렉토리를 잠재적 SPA 프로젝트로 간주하고 동적으로 체크
            checkIfProjectExists(firstDir, path);
            
            async function checkIfProjectExists(projectName, fullPath) {
                try {
                    // 타임아웃 설정 (3초)
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000);
                    
                    const checkUrl = `${origin}/${projectName}/index.html`;
                    const response = await fetch(checkUrl, { 
                        method: 'HEAD',
                        cache: 'no-cache',
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        // Content-Type 검증
                        const contentType = response.headers.get('content-type');
                        if (contentType && !contentType.includes('text/html')) {
                            console.warn('Not an HTML file:', contentType);
                            StateManager.unlockRedirect();
                            setTimeout(showError, 500);
                            return;
                        }
                        
                        // SPA 발견
                        console.log(`Found SPA: ${projectName}`);
                        redirectToSPA(projectName, fullPath);
                    } else {
                        StateManager.unlockRedirect();
                        setTimeout(showError, 500);
                    }
                } catch (error) {
                    console.error('Error checking project:', error);
                    StateManager.unlockRedirect();
                    
                    // 네트워크 오류 시 재시도
                    if (error.name === 'AbortError') {
                        console.warn('Request timeout');
                    }
                    
                    setTimeout(showError, 500);
                }
            }
            
            function redirectToSPA(projectName, fullPath) {
                // 프로젝트 경로 이후의 하위 경로 추출
                const projectBasePath = `/${projectName}`;
                let subPath = fullPath.substring(projectBasePath.length) || '/';
                
                // 서브 경로 정리
                subPath = SecurityUtils.sanitizePath(subPath);
                
                // 재귀 방지 기록
                attempted.push(fullPath);
                sessionStorage.setItem(attemptedKey, JSON.stringify(attempted));
                
                // BrowserRouter를 사용하는 프로젝트
                // sessionStorage에 원래 경로 저장 (프로젝트에서 처리)
                sessionStorage.setItem('spa_redirect_path', subPath);
                sessionStorage.setItem('spa_redirect_from_404', 'true');
                sessionStorage.setItem('spa_redirect_timestamp', Date.now().toString());
                
                // 목표 경로를 sessionStorage에도 저장 (뒤로가기 방어용)
                sessionStorage.setItem('spa_target_path', fullPath);
                
                // URL 파라미터로도 전달 (대체 방법)
                const encodedPath = encodeURIComponent(subPath);
                const redirectUrl = `${projectBasePath}/?redirect=${encodedPath}`;
                
                // 너무 긴 URL 방지 (브라우저 제한)
                if (redirectUrl.length > 2000) {
                    console.warn('URL too long, using sessionStorage only');
                    window.location.replace(projectBasePath);
                    return;
                }
                
                pathInfo.textContent = `Found ${projectName} project! Redirecting...`;
                console.log(`Redirecting from ${fullPath} to ${redirectUrl}`);
                
                // 정리
                StateManager.unlockRedirect();
                
                // replace를 사용해 히스토리에서 404 페이지를 대체
                // 즉시 리다이렉트 (지연 제거)
                window.location.replace(redirectUrl);
            }
            
            function showError() {
                // 모든 임시 데이터 정리
                sessionStorage.removeItem(attemptedKey);
                sessionStorage.removeItem('spa_redirect_path');
                sessionStorage.removeItem('spa_redirect_from_404');
                sessionStorage.removeItem('spa_redirect_timestamp');
                sessionStorage.removeItem('redirect_lock');
                
                loadingState.style.display = 'none';
                errorState.style.display = 'block';
            }
            
            // 10초 후에도 로딩 중이면 에러 표시
            setTimeout(() => {
                if (loadingState.style.display !== 'none') {
                    StateManager.unlockRedirect();
                    showError();
                }
            }, 10000);
            
            // 페이지 언로드 시 정리
            window.addEventListener('unload', () => {
                StateManager.unlockRedirect();
            });
        })();
    </script>
</body>
</html>
